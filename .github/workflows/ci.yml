name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (${{ matrix.install }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        install:
          - "-e ."
          - "-e .[qiskit-integration]"
          - "-e .[jaqalpaq-integration]"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package (editable)
        run: |
          python -m pip install -U pip
          pip install ${{ matrix.install }}
          pip install coverage

      - name: Run unit tests with coverage
        run: |
          coverage run -m unittest
          coverage html
          coverage xml

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.install }}
          path: htmlcov/

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.install }}
          path: coverage.xml
