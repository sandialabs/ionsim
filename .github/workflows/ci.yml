name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pip-basic
            installer: pip
            install: "-e ."
          - name: pip-qiskit
            installer: pip
            install: "-e .[qiskit-integration]"
          - name: pip-jaqalpaq
            installer: pip
            install: "-e .[jaqalpaq-integration]"
          - name: uv-basic
            installer: uv
            install: "-e ."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@v4

      - name: Install package with pip
        if: matrix.installer == 'pip'
        run: |
          python -m pip install -U pip
          pip install ${{ matrix.install }}
          pip install coverage

      - name: Install package with uv
        if: matrix.installer == 'uv'
        run: |
          uv pip install --system -e .
          uv pip install --system coverage

      - name: Run unit tests with coverage
        run: |
          coverage run -m unittest
          coverage html
          coverage xml

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.name }}
          path: htmlcov/

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.name }}
          path: coverage.xml
